name: Enviar noticias Switch 2 a Telegram

on:
  schedule:
    - cron: '0 * * * *' # cada hora
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Restaurar base de noticias enviadas
        uses: actions/cache@v5
        with:
          path: seen.db
          key: seen-db-${{ github.run_id }}
          restore-keys: |
            seen-db-
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Ejecutar bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_URL: ${{ secrets.TELEGRAM_CHANNEL_URL }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          DATABASE_PATH: seen.db
          CHANNEL_TIMEZONE: Europe/Madrid
        run: python switch_news_bot.py
